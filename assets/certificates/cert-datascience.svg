<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg-grad)"/>
  <rect width="800" height="560" fill="url(#grid)"/>

  <!-- Glowing Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="url(#cyan-grad)" stroke-width="2" opacity="0.8"/>
  <rect x="30" y="30" width="740" height="500" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Top Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="4"/>
  <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#00F0FF" stroke-width="4"/>
  <path d="M 20 510 L 20 540 L 50 540" fill="none" stroke="#00F0FF" stroke-width="4"/>
  <path d="M 780 510 L 780 540 L 750 540" fill="none" stroke="#00F0FF" stroke-width="4"/>

  <!-- Seal Icon -->
  <circle cx="400" cy="110" r="40" fill="none" stroke="url(#cyan-grad)" stroke-width="3"/>
  <polygon points="400,82 410,102 432,102 414,115 421,136 400,122 379,136 386,115 368,102 390,102" fill="url(#cyan-grad)"/>

  <!-- Certificate Header -->
  <text x="400" y="185" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="400" y="225" text-anchor="middle" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" letter-spacing="2">BS IN DATA SCIENCE &amp; APPLICATIONS</text>

  <!-- Divider Line -->
  <line x1="250" y1="245" x2="550" y2="245" stroke="url(#cyan-grad)" stroke-width="2"/>

  <!-- Recipient Section -->
  <text x="400" y="280" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">PROUDLY PRESENTED TO</text>
  <text x="400" y="325" text-anchor="middle" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="32" font-weight="800">MD TOUSIF RAZA</text>

  <!-- Description -->
  <text x="400" y="365" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" width="600">For successfully pursuing foundational and advanced modules in Data Analysis,</text>
  <text x="400" y="388" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Machine Learning, and Computational Data Science.</text>

  <!-- Footer Information -->
  <g transform="translate(100, 440)">
    <!-- Issuer -->
    <text x="0" y="20" fill="#00FF66" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">ISSUER: IIT MADRAS</text>
    <text x="0" y="40" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">VERIFIED ACADEMIC CREDENTIAL</text>

    <!-- Date -->
    <text x="600" y="20" text-anchor="end" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">YEAR: 2025 - 2029</text>
    <text x="600" y="40" text-anchor="end" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">ID: MTR-DS-IITM-2025</text>
  </g>
</svg>
